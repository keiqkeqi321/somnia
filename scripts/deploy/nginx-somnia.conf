server {
    listen 443 ssl;
    server_name @SERVER_NAME@;

    ssl_certificate     @TLS_CERT@;
    ssl_certificate_key @TLS_KEY@;

    root @WEB_DIR@;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # The site root serves the product homepage. Requests carrying the
    # ?remote=1 query (e.g. Desktop pairing confirmation links) still get the
    # Remote web client shell instead.
    location = / {
        set $entry_root @HOME_DIR@;
        if ($arg_remote = "1") {
            set $entry_root @WEB_DIR@;
        }
        root $entry_root;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Canonical entry of the Remote web client (hash-routed SPA, so only the
    # shell path matters).
    location = /app {
        return 301 /app/;
    }

    location = /app/ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # The app shell references its hashed bundles relative to itself
    # (./assets/...), which resolve under /app/assets/ when served from /app/.
    location /app/assets/ {
        rewrite ^/app(/assets/.*)$ $1 last;
    }

    # Static files of the product homepage (logo, ...); unhashed content, so
    # revalidate like the HTML shell.
    location /home-assets/ {
        alias @HOME_DIR@/home-assets/;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Legacy app entry: old /index.html#/connect bookmarks keep working.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build artifacts never change under the same URL and can be cached
    # forever; the HTML shell must revalidate on every load so deploys take
    # effect without a hard refresh.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Anything else lands on the homepage.
    location / {
        return 302 /;
    }
}

# Plain HTTP only redirects to HTTPS.
server {
    listen 80;
    server_name @SERVER_NAME@;
    return 301 https://$host$request_uri;
}
