[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "somnia"
dynamic = ["version"]
description = "A modular AI agent CLI inspired by the full reference harness."
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Somnia Team"},
]
keywords = ["ai", "agent", "cli", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anyio>=4.5",
    "anthropic>=0.25.0",
    "argon2-cffi>=23,<26",
    "cryptography>=43,<50",
    "httpx>=0.27.1,<1.0.0",
    "mcp>=1.27.2,<2",
    "openai>=1.47.0",
    "pathspec>=0.12,<2",
    "Pillow>=10.3.0",
    "prompt_toolkit>=3.0.43",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2,<3",
    "starlette>=0.41,<2",
    "tiktoken>=0.8.0",
    "uvicorn>=0.30,<1",
    "websockets>=14,<16",
]

[project.urls]
Homepage = "https://github.com/your-org/somnia"
Repository = "https://github.com/your-org/somnia"
Issues = "https://github.com/your-org/somnia/issues"

[project.scripts]
somnia = "open_somnia.cli.main:main"
somnia-sidecar = "desktop.backend.bootstrap:main"
somnia-connector = "open_somnia.remote.cli:connector_main"
somnia-relay = "open_somnia.remote.cli:relay_main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["open_somnia*", "desktop*"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
